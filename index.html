<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>星旅 · 旅行相册社区</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div id="starfield"></div>
  <div id="vignette"></div>

  <header id="navbar">
    <div class="brand">
      <span class="brand-star">✦</span>
      <span class="brand-name">星旅</span>
    </div>
    <div class="nav-right">
      <span id="photo-count" class="photo-count">0 颗星</span>
      <button id="upload-btn" class="btn-primary">上传照片</button>
    </div>
  </header>

  <div id="hint-bar" class="hint-bar">
    <span id="hint-text">加载中…</span>
  </div>

  <div id="viewer"></div>
  <div id="toast" class="toast"></div>

  <!-- 上传弹窗 -->
  <div id="upload-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2>上传照片</h2>
      <form id="upload-form">
        <label class="drop-zone" id="drop-zone">
          <input type="file" id="file-input" accept="image/*" hidden />
          <img id="preview-img" class="preview-img hidden" alt="" />
          <div id="drop-hint" class="drop-hint">点击选择照片<br /><span>自动压缩至 1200px</span></div>
        </label>
        <div class="field">
          <label>标题 *</label>
          <input id="f-title" type="text" maxlength="40" placeholder="给这张照片起个名字" />
        </div>
        <div class="field">
          <label>描述</label>
          <textarea id="f-desc" rows="2" maxlength="200" placeholder="照片背后的故事…"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label>拍摄地点</label>
            <input id="f-location" type="text" maxlength="40" placeholder="如：冰岛 · 雷克雅未克" />
          </div>
          <div class="field">
            <label>拍摄时间</label>
            <input id="f-taken" type="date" />
          </div>
        </div>
        <div class="field">
          <label>昵称</label>
          <input id="f-author" type="text" maxlength="20" placeholder="旅行者" />
        </div>
        <div class="modal-actions">
          <button type="button" id="upload-cancel" class="btn-ghost">取消</button>
          <button type="submit" id="upload-submit" class="btn-primary" disabled>上传</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
